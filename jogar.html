<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preparando PC — BIG-Room</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #000; color: #fff; height: 100vh; overflow: hidden; }
    
    .loading-video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .loading-video-container video { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-pausar { 
      position: absolute; top: 2rem; right: 2rem; z-index: 10; 
      background: rgba(239, 68, 68, 0.8); border: 1px solid #ef4444; 
      color: #fff; padding: 0.8rem 1.5rem; border-radius: 8px; 
      font-weight: bold; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); 
    }
    .btn-pausar:hover { background: #ef4444; transform: scale(1.05); }
    
    .tela-pausa { 
      display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.95); 
      z-index: 100; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
    }
    .tela-pausa h2 { font-size: 2.5rem; color: #f97316; margin-bottom: 1rem; }
    .tela-pausa p { color: #ccc; margin-bottom: 2rem; font-size: 1.2rem; max-width: 500px; }
    .btn-continuar { background: #f97316; color: #fff; border: none; padding: 1rem 2rem; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    
    .tela-jogo { 
      display: none; position: absolute; inset: 0; background: #111; z-index: 200; 
      flex-direction: column; align-items: center; justify-content: center; text-align: center; 
    }
    .tela-jogo h2 { color: #10b981; font-size: 3rem; }
    
    /* Animação de carregamento */
    .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #f97316; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 1rem auto; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  
  <!-- CONECTANDO SOCKET.IO À NUVEM -->
  <script src="https://big-room-servidor.onrender.com/socket.io/socket.io.js"></script>
</head>
<body>

  <button class="btn-pausar" id="btnPausar" onclick="pausarSessao()">⏸ Sair de Sessão</button>

  <div class="loading-video-container" id="telaCarregando">
    <video src="loading_bigroom.mp4" autoplay muted loop playsinline></video>
  </div>

  <div class="tela-pausa" id="telaPausa">
    <h2>Sessão Pausada</h2>
    <p id="msgPausa">Você tem tempo de jogo salvo na sua conta.</p>
    <button class="btn-continuar" onclick="retomarSessao()">Retomar Jogo</button>
    <button style="margin-top: 1rem; background: none; border: none; color: #888; cursor: pointer;" onclick="window.location.href='index.html'">Sair de vez (Perder tempo)</button>
  </div>

  <!-- TELA DE SUCESSO (Sem IP e Sem Porta) -->
  <div class="tela-jogo" id="telaJogo">
    <h2>✅ Conectado!</h2>
    <p style="margin-top: 1rem; color: #ccc;">Sua máquina foi alocada com sucesso.</p>
    <p style="margin-top: 0.5rem; color: #f97316;">Iniciando o jogo...</p>
  </div>

  <script>
    let socket;
    const tempoSalvo = localStorage.getItem('bigroom_tempo_restante');

    if (tempoSalvo) {
      document.getElementById('telaCarregando').style.display = 'none';
      document.getElementById('btnPausar').style.display = 'none';
      document.getElementById('telaPausa').style.display = 'flex';
      document.getElementById('msgPausa').innerText = `Você tem ${tempoSalvo} minutos salvos. Deseja continuar de onde parou?`;
    } else {
      iniciarConexao();
    }

    function iniciarConexao() {
      document.getElementById('telaCarregando').style.display = 'block';
      document.getElementById('telaPausa').style.display = 'none';
      document.getElementById('telaJogo').style.display = 'none';
      document.getElementById('btnPausar').style.display = 'block';

      try {
        socket = io('https://big-room-servidor.onrender.com', {
            transports: ['websocket']
        });
        
        socket.on('connect', () => {
          socket.emit('iniciar_maquina');
        });

        socket.on('maquina_pronta', (dados) => {
          document.getElementById('telaCarregando').style.display = 'none';
          document.getElementById('telaJogo').style.display = 'flex';
          
          // NÃO MOSTRAMOS MAIS O IP E A PORTA AQUI
          
          setTimeout(() => {
            window.location.href = 'tela-jogo.html';
          }, 2500); // 2.5 segundos para o jogador ler "Conectado"
        });

        socket.on('connect_error', (err) => {
          // Se o servidor estiver dormindo, avisa e tenta de novo silenciosamente
          console.log("Tentando conectar ao servidor...");
        });

      } catch (e) {
        console.error("Erro no Socket:", e);
      }
    }

    function pausarSessao() {
      let tempoRestante = 45;
      localStorage.setItem('bigroom_tempo_restante', tempoRestante.toString());
      alert(`Sessão pausada! Você tem ${tempoRestante} minutos salvos.`);
      window.location.href = 'index.html';
    }

    function retomarSessao() {
      let tempoSalvoAgora = localStorage.getItem('bigroom_tempo_restante');
      localStorage.removeItem('bigroom_tempo_restante');
      alert(`Retomando jogo... Você tem ${tempoSalvoAgora} minutos restando.`);
      document.getElementById('telaPausa').style.display = 'none';
      iniciarConexao();
    }
  </script>
</body>
</html>
