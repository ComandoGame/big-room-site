<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Host — BIG-Room</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-container { max-width: 1200px; margin: 4rem auto; padding: 0 2rem; position: relative; z-index: 1; }
    .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .header-admin h1 { color: #fff; font-size: 2rem; font-weight: 800; }
    
    .login-box { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--borda); padding: 3rem; border-radius: 16px; max-width: 400px; margin: 0 auto; text-align: center; }
    .login-box h2 { margin-bottom: 1.5rem; color: #fff; }
    .login-box input { width: 100%; padding: 1rem; margin-bottom: 1rem; border-radius: 10px; border: 1px solid var(--borda); background: rgba(0,0,0,0.5); color: #fff; font-size: 1rem; }
    .login-box button { width: 100%; padding: 1rem; border-radius: 10px; background: linear-gradient(135deg, var(--laranja), var(--laranja-esc)); color: #fff; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; }
    
    .metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
    .metrica-card { padding: 2rem; text-align: center; border-top: 4px solid var(--laranja); background: var(--bg-card); border-radius: 12px; }
    .metrica-card span { display: block; color: var(--texto-fraco); font-size: 0.95rem; margin-bottom: 0.5rem; font-weight: 500; }
    .metrica-card strong { font-size: 2.5rem; color: #fff; font-weight: 800; }

    .users-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5rem; }
    .user-card { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--borda); border-radius: 16px; padding: 1.5rem; position: relative; }
    .user-card.banido { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.05); }
    
    .user-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; border-bottom: 1px solid var(--borda); padding-bottom: 1rem; }
    .user-name { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .user-code { font-family: monospace; font-size: 0.8rem; color: #fbbf24; background: rgba(251, 191, 36, 0.1); padding: 2px 6px; border-radius: 4px; }
    .user-email { color: var(--texto-fraco); font-size: 0.9rem; display: block; margin-top: 0.2rem; }
    
    .user-info-row { display: flex; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.9rem; }
    .user-info-row span { color: var(--texto-fraco); }
    .user-info-row strong { color: #fff; }
    
    .saldo-destaque { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .saldo-destaque span { color: var(--verde); font-weight: bold; font-size: 0.9rem; }
    .saldo-destaque strong { color: var(--verde); font-size: 1.4rem; }

    .sessao-box { background: rgba(0,0,0,0.3); padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .tag-plano { background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .tag-tempo { background: rgba(16, 185, 129, 0.2); color: var(--verde); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .tag-banido { color: var(--vermelho); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
    
    .acoes { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .btn-acao { flex: 1; padding: 0.6rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.8rem; color: #fff; display: flex; align-items: center; justify-content: center; }
    .btn-saldo { background: rgba(249, 115, 22, 0.2); color: var(--laranja); border: 1px solid var(--laranja); }
    .btn-tempo { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    .btn-zerar { background: rgba(107, 114, 128, 0.2); color: #9ca3af; border: 1px solid #6b7280; }
    .btn-banir { background: rgba(239, 68, 68, 0.2); color: var(--vermelho); border: 1px solid var(--vermelho); }
    .btn-desbanir { background: rgba(16, 185, 129, 0.2); color: var(--verde); border: 1px solid var(--verde); }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div><div class="grid-overlay"></div></div>

  <header class="navbar">
    <a href="index.html" class="logo">🎮 BIG<span>Room</span> Admin</a>
    <nav><a href="index.html">← Voltar ao Site</a></nav>
  </header>

  <div class="admin-container">
    <div class="header-admin">
      <h1>🖥️ Controle de Usuários</h1>
      <button class="btn-outline" onclick="sairAdmin()" id="btnSair" style="display:none;">Sair do Painel</button>
    </div>

    <div class="login-box" id="telaLogin">
      <h2>Acesso Restrito</h2>
      <input type="password" id="senhaAdmin" placeholder="Digite a chave de acesso" />
      <button onclick="fazerLoginAdmin()">Entrar no Painel</button>
    </div>

    <div id="painelDados" style="display: none;">
      <div class="metricas">
        <div class="metrica-card"><span>Total de Usuários</span><strong id="totalUsuarios">0</strong></div>
        <div class="metrica-card"><span>Saldo Total em Contas</span><strong id="saldoTotal" style="color: var(--verde);">R$ 0,00</strong></div>
      </div>
      <div class="users-grid" id="usersGrid"></div>
    </div>
  </div>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    const API_URL = 'https://big-room-servidor.onrender.com';

    window.onload = () => { if (sessionStorage.getItem('adminToken')) carregarPainel(); }

    async function fazerLoginAdmin() {
      const senha = document.getElementById('senhaAdmin').value;
      try {
        const response = await fetch(`${API_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senha })
        });
        const data = await response.json();
        if (response.ok) {
          sessionStorage.setItem('adminToken', data.token);
          carregarPainel();
        } else { alert("❌ " + data.erro); }
      } catch (error) { alert("Erro ao conectar."); }
    }

    async function carregarPainel() {
        const token = sessionStorage.getItem('adminToken');
        try {
            const response = await fetch(`${API_URL}/api/admin/usuarios`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                const data = await response.json();
                document.getElementById('telaLogin').style.display = 'none';
                document.getElementById('painelDados').style.display = 'block';
                document.getElementById('btnSair').style.display = 'block';
                renderizarCards(data.usuarios);
            } else { sairAdmin(); }
        } catch (error) { alert("Erro ao carregar dados."); }
    }

    function renderizarCards(usuarios) {
      const grid = document.getElementById('usersGrid');
      grid.innerHTML = '';
      let saldoTotal = 0;

      usuarios.forEach(user => {
        saldoTotal += user.saldo;
        const isBanido = user.banido === 1;
        const statusClass = isBanido ? 'banido' : '';
        const btnBanir = isBanido 
            ? `<button class="btn-acao btn-desbanir" onclick="alterarBanimento(${user.id}, false)">Desbanir</button>`
            : `<button class="btn-acao btn-banir" onclick="alterarBanimento(${user.id}, true)">Banir</button>`;

        let sessaoHtml = `<span style="color:#6b7280; font-size: 0.85rem;">Nenhuma sessão</span>`;
        if (user.plano_ativo && user.plano_ativo !== 'Nenhum') {
            sessaoHtml = `<div><span class="tag-plano">${user.plano_ativo}</span></div><div><span class="tag-tempo">${user.tempo_restante} min</span></div>`;
        }

        const card = document.createElement('div');
        card.className = `user-card ${statusClass}`;
        card.innerHTML = `
          <div class="user-header">
            <div>
              <div class="user-name">${user.nome} ${isBanido ? '<span class="tag-banido">(Banido)</span>' : ''}</div>
              <span class="user-email">${user.email}</span>
            </div>
            <span class="user-code">${user.codigo_conta || 'N/A'}</span>
          </div>
          <div class="saldo-destaque"><span>Saldo em Conta:</span><strong>R$ ${user.saldo.toFixed(2)}</strong></div>
          <div class="user-info-row"><span>Endereço IP:</span><strong>${user.ip || 'Desconhecido'}</strong></div>
          <div class="user-info-row"><span>Hardware ID:</span><strong style="font-size:0.7rem;">${user.visitor_id || 'Desconhecido'}</strong></div>
          <div class="sessao-box"><span style="color: var(--texto-fraco); font-size: 0.85rem;">Sessão:</span><div style="display: flex; gap: 0.5rem;">${sessaoHtml}</div></div>
          <div class="acoes">
            <button class="btn-acao btn-saldo" onclick="alterarSaldo(${user.id})">+/- Saldo</button>
            <button class="btn-acao btn-tempo" onclick="adicionarTempo(${user.id})">+ Tempo</button>
            <button class="btn-acao btn-zerar" onclick="zerarTempo(${user.id})">Zerar</button>
            ${btnBanir}
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('totalUsuarios').innerText = usuarios.length;
      document.getElementById('saldoTotal').innerText = `R$ ${saldoTotal.toFixed(2)}`;
    }

    async function alterarSaldo(idUsuario) {
      let valorString = prompt("Digite o valor para ADICIONAR (ex: 50) ou REMOVER (ex: -10):");
      if (!valorString) return;
      let valor = parseFloat(valorString.replace(',', '.'));
      if (isNaN(valor)) return alert("Valor inválido.");
      const token = sessionStorage.getItem('adminToken');
      try {
        const response = await fetch(`${API_URL}/api/admin/saldo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ idUsuario, valor })
        });
        const data = await response.json();
        if (response.ok) { alert(data.mensagem); carregarPainel(); } else { alert(data.erro); }
      } catch (error) { alert("Erro no servidor."); }
    }

    async function adicionarTempo(idUsuario) {
      let minutosString = prompt("Quantos MINUTOS deseja adicionar? (ex: 30, 60)");
      if (!minutosString) return;
      let minutos = parseInt(minutosString);
      if (isNaN(minutos) || minutos <= 0) return alert("Minutos inválidos.");
      let plano = prompt("Qual o nome do plano? (ex: 1h, VIP, Teste)") || "Manual";
      const token = sessionStorage.getItem('adminToken');
      try {
        const response = await fetch(`${API_URL}/api/admin/tempo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ idUsuario, minutos, plano })
        });
        const data = await response.json();
        if (response.ok) { alert(data.mensagem); carregarPainel(); } else { alert(data.erro); }
      } catch (error) { alert("Erro no servidor."); }
    }

    async function zerarTempo(idUsuario) {
      if (!confirm("Tem certeza que deseja ZERAR o tempo deste usuário?")) return;
      const token = sessionStorage.getItem('adminToken');
      try {
        const response = await fetch(`${API_URL}/api/admin/tempo`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ idUsuario, minutos: 0, plano: 'Nenhum' })
        });
        const data = await response.json();
        if (response.ok) { alert(data.mensagem); carregarPainel(); } else { alert(data.erro); }
      } catch (error) { alert("Erro no servidor."); }
    }

    async function alterarBanimento(idUsuario, banir) {
      const acao = banir ? "BANIR" : "DESBANIR";
      if (!confirm(`Tem certeza que deseja ${acao}? O dispositivo e o IP serão bloqueados.`)) return;
      const token = sessionStorage.getItem('adminToken');
      try {
        const response = await fetch(`${API_URL}/api/admin/banir`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ idUsuario, banir })
        });
        const data = await response.json();
        if (response.ok) { alert(data.mensagem); carregarPainel(); } else { alert(data.erro); }
      } catch (error) { alert("Erro no servidor."); }
    }

    function sairAdmin() {
      sessionStorage.removeItem('adminToken');
      document.getElementById('telaLogin').style.display = 'block';
      document.getElementById('painelDados').style.display = 'none';
      document.getElementById('btnSair').style.display = 'none';
    }
  </script>
</body>
</html>
