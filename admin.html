<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Host — BIG-Room</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* (Mantenha os estilos de admin-container, users-grid, etc) */
    .admin-container { max-width: 1200px; margin: 4rem auto; padding: 0 2rem; position: relative; z-index: 1; }
    .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .abas { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--borda); padding-bottom: 1rem; }
    .aba { background: transparent; border: none; color: var(--texto-fraco); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0.5rem 1rem; border-radius: 8px; transition: 0.2s; }
    .aba.ativa { color: var(--laranja); background: rgba(249, 115, 22, 0.1); border: 1px solid var(--laranja); }
    
    .mensagens-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.5rem; }
    .msg-card { background: var(--bg-card); border: 1px solid var(--borda); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; }
    .msg-header { display: flex; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid var(--borda); padding-bottom: 0.5rem; }
    .msg-nome { font-weight: bold; color: #fff; }
    .msg-data { font-size: 0.8rem; color: var(--texto-fraco); }
    .msg-email { color: var(--laranja); font-size: 0.9rem; }
    .msg-texto { color: #ccc; font-size: 0.95rem; line-height: 1.5; margin-top: 0.5rem; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px; flex-grow: 1; }
    
    .btn-gmail { background: #ea4335; color: #fff; border: none; padding: 0.8rem; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; text-decoration: none;}
    .btn-gmail:hover { background: #c5221f; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div><div class="grid-overlay"></div></div>

  <header class="navbar">
    <a href="index.html" class="logo">🎮 BIG<span>Room</span> Admin</a>
    <nav><a href="index.html">← Voltar ao Site</a></nav>
  </header>

  <div class="admin-container">
    <div class="header-admin">
      <h1>🖥️ Painel do Host</h1>
      <button class="btn-outline" onclick="sairAdmin()" id="btnSair" style="display:none;">Sair</button>
    </div>

    <div class="login-box" id="telaLogin">
      <h2>Acesso Restrito</h2>
      <input type="password" id="senhaAdmin" placeholder="Digite a chave de acesso" />
      <button onclick="fazerLoginAdmin()">Entrar no Painel</button>
    </div>

    <div id="painelDados" style="display: none;">
      <div class="abas">
        <button class="aba ativa" id="aba-usuarios" onclick="mudarAba('usuarios')">👥 Usuários</button>
        <button class="aba" id="aba-mensagens" onclick="mudarAba('mensagens')">✉️ Suporte</button>
      </div>

      <div id="conteudo-usuarios">
        <!-- (Seus cards de usuários ficam aqui) -->
        <div class="users-grid" id="usersGrid"></div>
      </div>

      <div id="conteudo-mensagens" style="display: none;">
        <div class="mensagens-grid" id="msgGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://big-room-servidor.onrender.com';

    window.onload = () => { if (sessionStorage.getItem('adminToken')) carregarPainel(); }

    function mudarAba(aba) {
        document.querySelectorAll('.aba').forEach(b => b.classList.remove('ativa'));
        document.getElementById(`aba-${aba}`).classList.add('ativa');
        if (aba === 'usuarios') {
            document.getElementById('conteudo-usuarios').style.display = 'block';
            document.getElementById('conteudo-mensagens').style.display = 'none';
            carregarPainel();
        } else {
            document.getElementById('conteudo-usuarios').style.display = 'none';
            document.getElementById('conteudo-mensagens').style.display = 'block';
            carregarMensagens();
        }
    }

    async function fazerLoginAdmin() {
      const senha = document.getElementById('senhaAdmin').value;
      try {
        const response = await fetch(`${API_URL}/api/admin/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha })
        });
        const data = await response.json();
        if (response.ok) {
          sessionStorage.setItem('adminToken', data.token);
          document.getElementById('telaLogin').style.display = 'none';
          document.getElementById('painelDados').style.display = 'block';
          document.getElementById('btnSair').style.display = 'block';
          carregarPainel();
        } else { alert("❌ " + data.erro); }
      } catch (error) { alert("Erro ao conectar."); }
    }

    // --- USUÁRIOS (Mantido igual) ---
    async function carregarPainel() {
        const token = sessionStorage.getItem('adminToken');
        try {
            const response = await fetch(`${API_URL}/api/admin/usuarios`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
            if (response.ok) { const data = await response.json(); renderizarCards(data.usuarios); }
        } catch (error) {}
    }

    function renderizarCards(usuarios) {
      // ... (Mantenha o código de renderização de usuários que você já tem)
    }

    // --- MENSAGENS (NOVO SISTEMA DE EMAIL) ---
    async function carregarMensagens() {
        const token = sessionStorage.getItem('adminToken');
        try {
            const response = await fetch(`${API_URL}/api/admin/mensagens`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
            if (response.ok) { 
                const data = await response.json(); 
                renderizarMensagens(data.mensagens); 
            }
        } catch (error) { alert("Erro ao carregar mensagens."); }
    }

    function renderizarMensagens(mensagens) {
        const grid = document.getElementById('msgGrid');
        grid.innerHTML = '';
        
        if (mensagens.length === 0) {
            grid.innerHTML = '<p style="color:#888;">Nenhuma mensagem recebida ainda.</p>';
            return;
        }

        mensagens.forEach(msg => {
            const dataFormatada = new Date(msg.data_envio).toLocaleString('pt-BR');
            
            // Cria o link do Gmail com o email do usuário preenchido
            const assunto = encodeURIComponent(`Resposta BIG-Room - Suporte`);
            const corpo = encodeURIComponent(`Olá ${msg.nome},\n\nEstamos respondendo à sua mensagem:\n"${msg.mensagem}"\n\n---\nAtenciosamente,\nEquipe BIG-Room.`);
            const linkGmail = `https://mail.google.com/mail/?view=cm&fs=1&to=${msg.email}&su=${assunto}&body=${corpo}`;

            const card = document.createElement('div');
            card.className = 'msg-card';
            card.innerHTML = `
                <div class="msg-header">
                    <span class="msg-nome">${msg.nome}</span>
                    <span class="msg-data">${dataFormatada}</span>
                </div>
                <div class="msg-email">${msg.email}</div>
                <div class="msg-texto">${msg.mensagem}</div>
                <a href="${linkGmail}" target="_blank" class="btn-gmail">
                    ✉️ Responder no Gmail
                </a>
            `;
            grid.appendChild(card);
        });
    }

    // ... (Mantenha as funções alterarSaldo, adicionarTempo, etc) ...
  </script>
</body>
</html>
