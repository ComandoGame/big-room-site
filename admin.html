<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel do Host — BIG-Room</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* (Mantenha os estilos de admin-container, abas, login-box, etc) */
    .admin-container { max-width: 1200px; margin: 4rem auto; padding: 0 2rem; position: relative; z-index: 1; }
    .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .abas { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--borda); padding-bottom: 1rem; }
    .aba { background: transparent; border: none; color: var(--texto-fraco); font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 0.5rem 1rem; border-radius: 8px; transition: 0.2s; }
    .aba.ativa { color: var(--laranja); background: rgba(249, 115, 22, 0.1); border: 1px solid var(--laranja); }
    
    /* ESTILOS DO CHAT ADMIN */
    .chat-admin-container { max-width: 800px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--borda); border-radius: 16px; padding: 2rem; display: none; flex-direction: column; height: 600px; }
    .chat-mensagens { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 12px; margin-bottom: 1rem; }
    .msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 0.95rem; }
    .msg.user { background: rgba(249, 115, 22, 0.2); border: 1px solid var(--laranja); align-self: flex-start; }
    .msg.admin { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--verde); align-self: flex-end; }
    .msg-sender { font-size: 0.7rem; color: #aaa; display: block; margin-bottom: 4px; }
    
    /* LISTA DE CONVERSAS */
    .conversa-card { background: var(--bg-card); border: 1px solid var(--borda); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; cursor: pointer; transition: 0.2s; }
    .conversa-card:hover { border-color: var(--laranja); }
    .conversa-nome { font-weight: bold; color: #fff; font-size: 1.2rem; }
    .conversa-ultima { color: var(--texto-fraco); font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div><div class="grid-overlay"></div></div>

  <header class="navbar">
    <a href="index.html" class="logo">🎮 BIG<span>Room</span> Admin</a>
    <nav><a href="index.html">← Voltar ao Site</a></nav>
  </header>

  <div class="admin-container">
    <div class="header-admin">
      <h1>🖥️ Painel do Host</h1>
      <button class="btn-outline" onclick="sairAdmin()" id="btnSair" style="display:none;">Sair</button>
    </div>

    <div class="login-box" id="telaLogin">
      <h2>Acesso Restrito</h2>
      <input type="password" id="senhaAdmin" placeholder="Digite a chave de acesso" />
      <button onclick="fazerLoginAdmin()">Entrar no Painel</button>
    </div>

    <div id="painelDados" style="display: none;">
      <div class="abas">
        <button class="aba ativa" id="aba-usuarios" onclick="mudarAba('usuarios')">👥 Usuários</button>
        <button class="aba" id="aba-mensagens" onclick="mudarAba('mensagens')">✉️ Suporte</button>
      </div>

      <div id="conteudo-usuarios">
        <div id="usersGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1.5rem;"></div>
      </div>

      <div id="conteudo-mensagens" style="display: none;">
        <div id="listaConversas"></div>
        <div class="chat-admin-container" id="chatAdminContainer">
            <button class="btn-outline" onclick="voltarLista()" style="margin-bottom:1rem; align-self:flex-start;">← Voltar</button>
            <h3 id="chatAdminNome" style="color:#fff; margin-bottom:1rem;"></h3>
            <div class="chat-mensagens" id="chatAdminMensagens"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="inpAdminResposta" placeholder="Digite a resposta..." style="flex:1; padding:1rem; border-radius:10px; background:rgba(0,0,0,0.5); border:1px solid var(--borda); color:#fff;" onkeypress="if(event.key==='Enter') enviarRespostaAdmin()" />
                <button class="btn-primary" onclick="enviarRespostaAdmin()">Enviar</button>
            </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://big-room-servidor.onrender.com';
    let conversasGlobais = [];
    let usuarioChatAtual = null;

    window.onload = () => { if (sessionStorage.getItem('adminToken')) carregarPainel(); }

    function mudarAba(aba) {
        document.querySelectorAll('.aba').forEach(b => b.classList.remove('ativa'));
        document.getElementById(`aba-${aba}`).classList.add('ativa');
        if (aba === 'usuarios') {
            document.getElementById('conteudo-usuarios').style.display = 'block';
            document.getElementById('conteudo-mensagens').style.display = 'none';
            carregarPainel();
        } else {
            document.getElementById('conteudo-usuarios').style.display = 'none';
            document.getElementById('conteudo-mensagens').style.display = 'block';
            carregarConversas();
        }
    }

    async function fazerLoginAdmin() {
      const senha = document.getElementById('senhaAdmin').value;
      try {
        const response = await fetch(`${API_URL}/api/admin/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha })
        });
        const data = await response.json();
        if (response.ok) {
          sessionStorage.setItem('adminToken', data.token);
          document.getElementById('telaLogin').style.display = 'none';
          document.getElementById('painelDados').style.display = 'block';
          document.getElementById('btnSair').style.display = 'block';
          carregarPainel();
        } else { alert("❌ " + data.erro); }
      } catch (error) { alert("Erro ao conectar."); }
    }

    async function carregarPainel() {
        const token = sessionStorage.getItem('adminToken');
        try {
            const response = await fetch(`${API_URL}/api/admin/usuarios`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
            if (response.ok) { const data = await response.json(); renderizarCards(data.usuarios); }
        } catch (error) { alert("Erro ao carregar dados."); }
    }

    // RENDERIZAR CARDS DE USUÁRIOS (Mantido igual)
    function renderizarCards(usuarios) {
      const grid = document.getElementById('usersGrid');
      grid.innerHTML = '';
      usuarios.forEach(user => {
        const isBanido = user.banido === 1;
        const btnBanir = isBanido ? `<button class="btn-acao btn-desbanir" onclick="alterarBanimento(${user.id}, false)">Desbanir</button>` : `<button class="btn-acao btn-banir" onclick="alterarBanimento(${user.id}, true)">Banir</button>`;
        let sessaoHtml = (user.plano_ativo && user.plano_ativo !== 'Nenhum') ? `<div><span class="tag-plano">${user.plano_ativo}</span></div><div><span class="tag-tempo">${user.tempo_restante} min</span></div>` : `<span style="color:#6b7280; font-size: 0.85rem;">Nenhuma</span>`;
        
        const card = document.createElement('div');
        card.className = `user-card`;
        card.innerHTML = `
          <div class="user-header"><div><div class="user-name">${user.nome} ${isBanido ? '<span style="color:red;font-size:0.8rem;">(Banido)</span>' : ''}</div><span class="user-email">${user.email}</span></div><span class="user-code">${user.codigo_conta || 'N/A'}</span></div>
          <div class="saldo-destaque"><span>Saldo:</span><strong>R$ ${user.saldo.toFixed(2)}</strong></div>
          <div style="display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:0.5rem;"><span style="color:var(--texto-fraco);">IP:</span><strong>${user.ip || 'Desc.'}</strong></div>
          <div style="display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:0.5rem;"><span style="color:var(--texto-fraco);">Hardware:</span><strong style="font-size:0.7rem;">${user.visitor_id || 'Desc.'}</strong></div>
          <div class="sessao-box"><span style="color: var(--texto-fraco); font-size: 0.85rem;">Sessão:</span><div style="display: flex; gap: 0.5rem;">${sessaoHtml}</div></div>
          <div class="acoes"><button class="btn-acao btn-saldo" onclick="alterarSaldo(${user.id})">+/- Saldo</button><button class="btn-acao btn-tempo" onclick="adicionarTempo(${user.id})">+ Tempo</button><button class="btn-acao btn-zerar" onclick="zerarTempo(${user.id})">Zerar</button>${btnBanir}</div>
        `;
        grid.appendChild(card);
      });
    }

    // LÓGICA DO CHAT
    async function carregarConversas() {
        const token = sessionStorage.getItem('adminToken');
        try {
            const response = await fetch(`${API_URL}/api/admin/conversas`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` } });
            if (response.ok) { 
                const data = await response.json(); 
                conversasGlobais = data.conversas;
                renderizarListaConversas();
            }
        } catch (error) { alert("Erro ao carregar mensagens."); }
    }

    function renderizarListaConversas() {
        const lista = document.getElementById('listaConversas');
        document.getElementById('chatAdminContainer').style.display = 'none';
        lista.style.display = 'block';
        lista.innerHTML = '';

        const usuariosUnicos = [...new Set(conversasGlobais.map(c => c.usuario_id))];
        if (usuariosUnicos.length === 0) { lista.innerHTML = '<p style="color:#888;">Nenhuma conversa.</p>'; return; }

        usuariosUnicos.forEach(id => {
            const msgs = conversasGlobais.filter(c => c.usuario_id === id);
            const ultima = msgs[msgs.length - 1];
            
            const card = document.createElement('div');
            card.className = 'conversa-card';
            card.onclick = () => abrirChat(id, ultima.nome);
            card.innerHTML = `
                <div class="conversa-nome">${ultima.nome}</div>
                <div class="conversa-ultima">Última msg: ${ultima.mensagem}</div>
            `;
            lista.appendChild(card);
        });
    }

    function abrirChat(idUsuario, nome) {
        usuarioChatAtual = idUsuario;
        document.getElementById('listaConversas').style.display = 'none';
        document.getElementById('chatAdminContainer').style.display = 'flex';
        document.getElementById('chatAdminNome').innerHTML = `Chat com <span style="color:var(--laranja)">${nome}</span>`;
        renderizarChatAdmin();
    }

    function renderizarChatAdmin() {
        const chatBox = document.getElementById('chatAdminMensagens');
        chatBox.innerHTML = '';
        const msgs = conversasGlobais.filter(c => c.usuario_id === usuarioChatAtual);
        
        msgs.forEach(msg => {
            const isAdmin = msg.remetente === 'admin';
            chatBox.innerHTML += `
                <div class="msg ${isAdmin ? 'admin' : 'user'}">
                    <span class="msg-sender">${isAdmin ? 'Admin-Support' : msg.nome}</span>
                    ${msg.mensagem}
                </div>
            `;
        });
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function enviarRespostaAdmin() {
        const input = document.getElementById('inpAdminResposta');
        const texto = input.value;
        if (!texto || !usuarioChatAtual) return;
        input.value = "Enviando...";
        const token = sessionStorage.getItem('adminToken');
        try {
            await fetch(`${API_URL}/api/admin/responder`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ idUsuario: usuarioChatAtual, mensagem: texto })
            });
            input.value = "";
            carregarConversas();
            setTimeout(() => { if (usuarioChatAtual) abrirChat(usuarioChatAtual, 'Jogador'); }, 500);
        } catch (e) { alert("Erro."); }
    }

    function voltarLista() {
        document.getElementById('chatAdminContainer').style.display = 'none';
        document.getElementById('listaConversas').style.display = 'block';
        carregarConversas();
    }

    // ... (MANTENHA AS FUNÇÕES alterarSaldo, adicionarTempo, zerarTempo, alterarBanimento e sairAdmin que você já tem) ...
    async function alterarSaldo(idUsuario) {
      let valor = parseFloat(prompt("Valor para adicionar (ex: 50) ou remover (ex: -10):"));
      if (isNaN(valor)) return;
      const token = sessionStorage.getItem('adminToken');
      await fetch(`${API_URL}/api/admin/saldo`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ idUsuario, valor }) });
      carregarPainel();
    }
    async function adicionarTempo(idUsuario) {
      let minutos = parseInt(prompt("Minutos para adicionar:"));
      let plano = prompt("Nome do plano:") || "Manual";
      if (isNaN(minutos)) return;
      const token = sessionStorage.getItem('adminToken');
      await fetch(`${API_URL}/api/admin/tempo`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ idUsuario, minutos, plano }) });
      carregarPainel();
    }
    async function zerarTempo(idUsuario) {
      if (!confirm("Zerar tempo?")) return;
      const token = sessionStorage.getItem('adminToken');
      await fetch(`${API_URL}/api/admin/tempo`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ idUsuario, minutos: 0, plano: 'Nenhum' }) });
      carregarPainel();
    }
    async function alterarBanimento(idUsuario, banir) {
      if (!confirm(`Tem certeza?`)) return;
      const token = sessionStorage.getItem('adminToken');
      await fetch(`${API_URL}/api/admin/banir`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ idUsuario, banir }) });
      carregarPainel();
    }
    function sairAdmin() { sessionStorage.removeItem('adminToken'); window.location.reload(); }
  </script>
</body>
</html>
