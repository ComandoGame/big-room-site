<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Suporte — BIG-Room</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .container { max-width: 800px; margin: 4rem auto; padding: 0 2rem; position: relative; z-index: 1; }
    h1 { color: #fff; text-align: center; margin-bottom: 2rem; }
    .chat-box { background: var(--bg-card); border: 1px solid var(--borda); border-radius: 16px; padding: 2rem; display: flex; flex-direction: column; height: 500px; backdrop-filter: blur(16px); }
    .chat-mensagens { flex: 1; overflow-y: auto; padding-right: 10px; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
    .msg.user { background: rgba(249, 115, 22, 0.2); border: 1px solid var(--laranja); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.admin { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--verde); color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg-sender { font-size: 0.7rem; color: #aaa; display: block; margin-bottom: 4px; }
    .chat-input-area { display: flex; gap: 10px; }
    .chat-input-area input { flex: 1; padding: 1rem; border-radius: 10px; border: 1px solid var(--borda); background: rgba(0,0,0,0.5); color: #fff; }
    .chat-input-area button { padding: 1rem 2rem; border-radius: 10px; background: var(--laranja); color: #fff; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div><div class="grid-overlay"></div></div>
  <header class="navbar">
    <a href="index.html" class="logo">🎮 BIG<span>Room</span></a>
    <nav><a href="index.html">← Voltar</a></nav>
  </header>

  <div class="container">
    <h1>Suporte ao Jogador</h1>
    <div class="chat-box">
      <div class="chat-mensagens" id="chatMensagens">
        <p style="color:#888;text-align:center;">Carregando mensagens...</p>
      </div>
      <div class="chat-input-area">
        <input type="text" id="inpMensagem" placeholder="Digite sua dúvida..." onkeypress="if(event.key==='Enter') enviarMensagem()" />
        <button onclick="enviarMensagem()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://big-room-servidor.onrender.com';
    let idUsuarioLogado = null;

    async function verificarLogin() {
        try {
            const res = await fetch(`${API_URL}/api/me`, { credentials: 'include' });
            if (res.ok) {
                const data = await res.json();
                idUsuarioLogado = data.usuario.id;
                carregarChat();
            } else {
                document.getElementById('chatMensagens').innerHTML = '<p style="color:red;text-align:center;">Faça login no site para enviar mensagens.</p>';
            }
        } catch (e) {}
    }

    async function carregarChat() {
        if (!idUsuarioLogado) return;
        try {
            const res = await fetch(`${API_URL}/api/minhas-mensagens`, { credentials: 'include' });
            const data = await res.json();
            const chat = document.getElementById('chatMensagens');
            chat.innerHTML = '';

            if (data.conversas.length === 0) {
                chat.innerHTML = '<p style="color:#888;text-align:center;margin-top:2rem;">Nenhuma mensagem. Envie sua dúvida abaixo!</p>';
                return;
            }

            data.conversas.forEach(msg => {
                const isAdmin = msg.remetente === 'admin';
                chat.innerHTML += `
                    <div class="msg ${isAdmin ? 'admin' : 'user'}">
                        <span class="msg-sender">${isAdmin ? 'Admin-Support' : 'Você'}</span>
                        ${msg.mensagem}
                    </div>
                `;
            });
            chat.scrollTop = chat.scrollHeight;
        } catch (e) {}
    }

    async function enviarMensagem() {
        const input = document.getElementById('inpMensagem');
        const texto = input.value;
        if (!texto || !idUsuarioLogado) return;

        input.value = "Enviando...";
        try {
            await fetch(`${API_URL}/api/contato`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ mensagem: texto })
            });
            input.value = "";
            carregarChat();
        } catch (e) { alert("Erro ao enviar."); }
    }

    setInterval(carregarChat, 5000);
    verificarLogin();
  </script>
</body>
</html>
