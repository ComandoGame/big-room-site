<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Contato — BIG-Room</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .container { max-width: 600px; margin: 6rem auto; padding: 0 2rem; text-align: center; position: relative; z-index: 1; }
    h1 { font-size: 2.8rem; margin-bottom: 0.5rem; color: #fff; }
    .sub { color: var(--texto-fraco); margin-bottom: 3rem; font-size: 1.1rem; }
    
    .form-contato { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--borda); padding: 3rem; border-radius: 16px; text-align: left; }
    .form-contato label { display: block; color: #fff; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-contato input, .form-contato textarea { width: 100%; padding: 1rem; margin-bottom: 1.5rem; border-radius: 10px; border: 1px solid var(--borda); background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; font-family: inherit; }
    .form-contato input:focus, .form-contato textarea:focus { outline: none; border-color: var(--laranja); }
    .form-contato textarea { resize: vertical; min-height: 150px; }
    .btn-enviar { width: 100%; padding: 1rem; border-radius: 10px; background: var(--laranja); color: #fff; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn-enviar:hover { background: var(--laranja-esc); transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div><div class="grid-overlay"></div></div>
  <header class="navbar">
    <a href="index.html" class="logo">🎮 BIG<span>Room</span></a>
    <nav><a href="index.html">← Voltar</a></nav>
  </header>

  <div class="container">
    <h1>Fale com o Desenvolvedor</h1>
    <p class="sub">Responderemos diretamente no seu e-mail.</p>
    
    <form class="form-contato" onsubmit="enviarMensagem(event)">
      <label>Seu Nome</label>
      <input type="text" id="nomeContato" placeholder="Como devemos te chamar?" required />
      
      <label>Seu E-mail (Gmail, etc)</label>
      <input type="email" id="emailContato" placeholder="Seu melhor e-mail para contato" required />
      
      <label>Mensagem</label>
      <textarea id="mensagemContato" placeholder="Descreva sua dúvida ou problema..." required></textarea>
      
      <button type="submit" class="btn-enviar" id="btnEnviar">Enviar Mensagem</button>
    </form>
  </div>

  <script>
    const API_URL = 'https://big-room-servidor.onrender.com';

    async function enviarMensagem(e) {
      e.preventDefault();
      const btn = document.getElementById('btnEnviar');
      btn.innerText = "Enviando...";
      btn.disabled = true;

      const nome = document.getElementById('nomeContato').value;
      const email = document.getElementById('emailContato').value;
      const mensagem = document.getElementById('mensagemContato').value;

      try {
        const res = await fetch(`${API_URL}/api/contato`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, mensagem })
        });
        const data = await res.json();
        if (res.ok) {
          alert(data.mensagem);
          document.getElementById('nomeContato').value = '';
          document.getElementById('emailContato').value = '';
          document.getElementById('mensagemContato').value = '';
        } else {
          alert(data.erro);
        }
      } catch (err) {
        alert("Erro ao enviar. Verifique sua conexão.");
      } finally {
        btn.innerText = "Enviar Mensagem";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
