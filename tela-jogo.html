<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Preparando PC — BIG-Room</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #000; color: #fff; height: 100vh; overflow: hidden; }
    
    .loading-video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .loading-video-container video { width: 100%; height: 100%; object-fit: cover; }
    
    .btn-pausar { position: absolute; top: 2rem; right: 2rem; z-index: 10; background: rgba(239, 68, 68, 0.8); border: 1px solid #ef4444; color: #fff; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); }
    .btn-pausar:hover { background: #ef4444; transform: scale(1.05); }
    
    .tela-jogo { display: none; position: absolute; inset: 0; background: #111; z-index: 200; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .tela-jogo h2 { color: #10b981; font-size: 3rem; }
  </style>
  <script src="https://big-room-servidor.onrender.com/socket.io/socket.io.js"></script>
</head>
<body>

  <button class="btn-pausar" onclick="window.location.href='index.html'">⏸ Sair de Sessão</button>

  <div class="loading-video-container" id="telaCarregando">
    <video src="loading_bigroom.mp4" autoplay muted loop playsinline></video>
  </div>

  <div class="tela-jogo" id="telaJogo">
    <h2>✅ Conectado!</h2>
    <p style="margin-top: 1rem; color: #ccc;">Sua máquina foi alocada com sucesso.</p>
    <p style="margin-top: 0.5rem; color: #f97316;">Iniciando o jogo...</p>
  </div>

  <script>
    const socket = io('https://big-room-servidor.onrender.com', { transports: ['websocket'] });
    socket.on('connect', () => socket.emit('iniciar_maquina'));
    socket.on('maquina_pronta', () => {
      document.getElementById('telaCarregando').style.display = 'none';
      document.getElementById('telaJogo').style.display = 'flex';
      setTimeout(() => { window.location.href = 'tela-jogo.html'; }, 2500);
    });
  </script>
</body>
</html>
